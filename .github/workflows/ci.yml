name: Catalyst CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalyst-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm audit --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check HTTP responses and port fallback
        shell: bash
        run: bash scripts/e2e-smoke.sh
      - if: runner.os == 'Linux'
        run: pnpm --filter @catalyst/web exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm --filter @catalyst/web exec playwright test
      - if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: pnpm --dir packages/cli pack --pack-destination "${{ runner.temp }}"
      - name: Upload installable CLI
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: catalyst-cli-${{ github.sha }}
          path: ${{ runner.temp }}/catalyst-dx-*.tgz
          if-no-files-found: error
